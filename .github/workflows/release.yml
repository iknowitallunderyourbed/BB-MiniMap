name: Release

# Push a tag like v1.0.0 and this builds BBMapViewer.exe and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual run: builds the exe and uploads it as a workflow artifact only

permissions:
  contents: write      # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Syntax check
        run: python -m py_compile bb_map_viewer.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BBMapViewer bb_map_viewer.py

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\BBMapViewer.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BBMapViewer.exe" | Out-File -Encoding ascii dist\BBMapViewer.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BBMapViewer
          path: |
            dist/BBMapViewer.exe
            dist/BBMapViewer.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=(dist/BBMapViewer.exe dist/BBMapViewer.exe.sha256)
          ls -l "${files[@]}"
          flags=()
          if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # a release for this tag already exists (e.g. created by hand): just attach the files
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "BB Map Viewer $tag" --generate-notes "${flags[@]}"
          fi
